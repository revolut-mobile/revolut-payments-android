plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace "com.revolut.revolutpaylite.demo"
    compileSdk 36

    defaultConfig {
        applicationId "com.revolut.revolutpaylite.demo"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions = ["sdkVariant"]

    productFlavors {
        revolutPayLite {
            dimension "sdkVariant"
        }
        revolutPay {
            dimension "sdkVariant"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    packaging {
        resources {
            excludes += [
                    'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                    'META-INF/versions/9/OSGI-INF/*.xml'
            ]
        }
    }
    buildFeatures {
        viewBinding true
    }
    lint {
        baseline = file("lint-baseline.xml")
    }
}

dependencies {
    // Revolut Pay Lite SDK
    revolutPayLiteImplementation 'com.revolut.payments:revolutpaylite:3.3.0'
    revolutPayImplementation 'com.revolut.payments:revolutpay:3.3.0'

    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.4.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview-selection:1.1.0'

    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
}
